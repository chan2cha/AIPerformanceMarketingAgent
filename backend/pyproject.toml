[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "performance-marketing-backend"
version = "0.1.0"
description = "FastAPI backend and Celery worker for the AI Performance Marketing MVP"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14,<2",
  "celery[redis]>=5.4,<6",
  "fastapi>=0.115,<1",
  "openai>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.7,<3",
  "PyJWT[crypto]>=2.10,<3",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
  "ruff>=0.9,<1",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
markers = [
  "openai_smoke: opt-in test that makes a billable OpenAI API request",
]

[tool.ruff]
extend-exclude = ["build"]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]

[tool.setuptools.packages.find]
include = ["app*", "worker*"]

[tool.setuptools.package-data]
app = ["ai/pricing.json", "ai/prompts/**/*.md"]
