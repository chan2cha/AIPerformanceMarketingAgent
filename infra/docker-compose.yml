name: ai-performance-marketing

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-performance_marketing}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ../backend
      target: production
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://app:local-development-only@postgres:5432/performance_marketing}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/1}
      AI_PROVIDER: ${AI_PROVIDER:-fake}
      AI_JOB_MAX_RETRIES: ${AI_JOB_MAX_RETRIES:-2}
      AI_JOB_RETRY_DELAY_SECONDS: ${AI_JOB_RETRY_DELAY_SECONDS:-1}
      AD_LIBRARY_PROVIDER: ${AD_LIBRARY_PROVIDER:-fake}
      COLLECTION_JOB_MAX_RETRIES: ${COLLECTION_JOB_MAX_RETRIES:-2}
      COLLECTION_JOB_RETRY_DELAY_SECONDS: ${COLLECTION_JOB_RETRY_DELAY_SECONDS:-5}
      APP_ENV: ${APP_ENV:-local}
      AUTH_MODE: ${AUTH_MODE:-dev}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_JWT_AUDIENCE: ${SUPABASE_JWT_AUDIENCE:-authenticated}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:3001}
      BILLING_PROVIDER: ${BILLING_PROVIDER:-fake}
      BILLING_ENFORCEMENT_ENABLED: ${BILLING_ENFORCEMENT_ENABLED:-false}
      BILLING_MONTHLY_PRICE_USD: ${BILLING_MONTHLY_PRICE_USD:-40.00}
      BILLING_MONTHLY_CREDIT_USD: ${BILLING_MONTHLY_CREDIT_USD:-15.00}
      BILLING_ANALYSIS_LIMIT: ${BILLING_ANALYSIS_LIMIT:-200}
      BILLING_COLLECTION_RUN_LIMIT: ${BILLING_COLLECTION_RUN_LIMIT:-50}
      BILLING_BRAND_LIMIT: ${BILLING_BRAND_LIMIT:-1}
      BILLING_COMPETITOR_LIMIT: ${BILLING_COMPETITOR_LIMIT:-5}
      BILLING_ANALYSIS_RESERVATION_USD: ${BILLING_ANALYSIS_RESERVATION_USD:-0.05}
      BILLING_COLLECTION_RESERVATION_USD: ${BILLING_COLLECTION_RESERVATION_USD:-0.25}
      BILLING_SUCCESS_URL: ${BILLING_SUCCESS_URL:-http://localhost:3000/?billing=success}
      BILLING_CANCEL_URL: ${BILLING_CANCEL_URL:-http://localhost:3000/?billing=cancelled}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_PRICE_ID: ${STRIPE_PRICE_ID:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      APIFY_CONFIGURED: ${APIFY_CONFIGURED:-false}
      OPENAI_CONFIGURED: ${OPENAI_CONFIGURED:-false}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 10

  worker:
    build:
      context: ../backend
      target: production
    command: ["celery", "-A", "worker.celery_app:celery_app", "worker", "--loglevel=INFO"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://app:local-development-only@postgres:5432/performance_marketing}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/1}
      AI_PROVIDER: ${AI_PROVIDER:-fake}
      AI_JOB_MAX_RETRIES: ${AI_JOB_MAX_RETRIES:-2}
      AI_JOB_RETRY_DELAY_SECONDS: ${AI_JOB_RETRY_DELAY_SECONDS:-1}
      AD_LIBRARY_PROVIDER: ${AD_LIBRARY_PROVIDER:-fake}
      APIFY_API_TOKEN: ${APIFY_API_TOKEN:-}
      APIFY_BASE_URL: ${APIFY_BASE_URL:-https://api.apify.com/v2}
      APIFY_META_ACTOR_ID: ${APIFY_META_ACTOR_ID:-apify~facebook-ads-scraper}
      APIFY_TIKTOK_ACTOR_ID: ${APIFY_TIKTOK_ACTOR_ID:-khadinakbar~tiktok-ads-scraper}
      APIFY_TIMEOUT_SECONDS: ${APIFY_TIMEOUT_SECONDS:-120}
      APIFY_MAX_ITEMS_PER_SYNC: ${APIFY_MAX_ITEMS_PER_SYNC:-25}
      APIFY_MAX_CHARGE_USD_PER_SYNC: ${APIFY_MAX_CHARGE_USD_PER_SYNC:-0.25}
      APIFY_META_MAX_ITEMS_PER_SYNC: ${APIFY_META_MAX_ITEMS_PER_SYNC:-25}
      APIFY_META_MAX_CHARGE_USD_PER_SYNC: ${APIFY_META_MAX_CHARGE_USD_PER_SYNC:-0.25}
      APIFY_TIKTOK_PERIOD_DAYS: ${APIFY_TIKTOK_PERIOD_DAYS:-30}
      COLLECTION_JOB_MAX_RETRIES: ${COLLECTION_JOB_MAX_RETRIES:-2}
      COLLECTION_JOB_RETRY_DELAY_SECONDS: ${COLLECTION_JOB_RETRY_DELAY_SECONDS:-5}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6-luna}
      OPENAI_TIMEOUT_SECONDS: ${OPENAI_TIMEOUT_SECONDS:-30}
      BILLING_ENFORCEMENT_ENABLED: ${BILLING_ENFORCEMENT_ENABLED:-false}
      BILLING_MONTHLY_CREDIT_USD: ${BILLING_MONTHLY_CREDIT_USD:-15.00}
      BILLING_ANALYSIS_LIMIT: ${BILLING_ANALYSIS_LIMIT:-200}
      BILLING_COLLECTION_RUN_LIMIT: ${BILLING_COLLECTION_RUN_LIMIT:-50}
      BILLING_ANALYSIS_RESERVATION_USD: ${BILLING_ANALYSIS_RESERVATION_USD:-0.05}
      BILLING_COLLECTION_RESERVATION_USD: ${BILLING_COLLECTION_RESERVATION_USD:-0.25}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  scheduler:
    build:
      context: ../backend
      target: production
    command: ["celery", "-A", "worker.celery_app:celery_app", "beat", "--loglevel=INFO", "--schedule=/tmp/celerybeat-schedule"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://app:local-development-only@postgres:5432/performance_marketing}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/1}
      AD_LIBRARY_PROVIDER: ${AD_LIBRARY_PROVIDER:-fake}
      BILLING_ENFORCEMENT_ENABLED: ${BILLING_ENFORCEMENT_ENABLED:-false}
      BILLING_MONTHLY_CREDIT_USD: ${BILLING_MONTHLY_CREDIT_USD:-15.00}
      BILLING_ANALYSIS_LIMIT: ${BILLING_ANALYSIS_LIMIT:-200}
      BILLING_COLLECTION_RUN_LIMIT: ${BILLING_COLLECTION_RUN_LIMIT:-50}
      BILLING_ANALYSIS_RESERVATION_USD: ${BILLING_ANALYSIS_RESERVATION_USD:-0.05}
      BILLING_COLLECTION_RESERVATION_USD: ${BILLING_COLLECTION_RESERVATION_USD:-0.25}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  backend-test:
    profiles: ["test"]
    build:
      context: ../backend
      target: development
    command: ["pytest"]
    working_dir: /workspace
    volumes:
      - ../backend:/workspace
    environment:
      DATABASE_URL: postgresql+psycopg://app:local-development-only@postgres:5432/performance_marketing_test
      APP_ENV: test
      AUTH_MODE: dev
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6-luna}
      OPENAI_TIMEOUT_SECONDS: ${OPENAI_TIMEOUT_SECONDS:-30}
      APIFY_API_TOKEN: ${APIFY_API_TOKEN:-}
      APIFY_BASE_URL: ${APIFY_BASE_URL:-https://api.apify.com/v2}
      APIFY_TIKTOK_ACTOR_ID: ${APIFY_TIKTOK_ACTOR_ID:-khadinakbar~tiktok-ads-scraper}
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ../apps/web
    environment:
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://api:8000}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
